## この資料で分かること

:::summary
- 表のセルの `\|` が、行内のコードの中でも `|` と出るようになった理由。
- 道具の出力（会話の role tool の件）を、Markdown でなく文字のまま出す仕組み。
:::

## 背景と目的

iss-00061 で、`/embed/agent` のエージェントの発言を Markdown で描くようにしました。その最終品質ゲートで、2つの小さなずれが見つかりました。

1. 表のセルの `\|` が、行内のコードの中では `\|` のまま出ていた。GitHub の GFM は、列を分けた後、各セルの `\|` を `|` に戻してから行内を解きます（`\\|` も列を分けません。2026-11-18 に `gh api markdown` で確かめました）。
2. 会話の role tool の件の本文も、エージェントの発言として Markdown で描かれていた。描くのはエージェントの発言だけ、という決定に合いません。

## 全体の構成

```plantuml id=overview
@startuml
title 会話の行が描かれるまで
top to bottom direction
component "buildChat（agent-view.js）" as V
component "renderChatRow（agent-dom.js）" as D
component "parseMarkdown（markdown.js）" as P
V -> D : bubble の行（markdown は role assistant のときだけ真）
D -> P : markdown が真の行だけ
D --> D : 偽なら textContent の文字
@enduml
```

- `markdown.js` の parseTable は、セルを行内に解く前に `\|` を `|` に置き換えます。
- `agent-view.js` の buildChat は、bubble の行に `markdown`（元の role が assistant のときだけ真）を付けます。行の role と見た目は変えません。
- `agent-dom.js` の renderChatRow は、`markdown` が真の行だけを Markdown で描きます。

## 確認方法

```sh
node --test test/web/markdown.test.ts test/web/agent-view.test.ts test/web/agent-dom.test.ts
```

試しの画面の写しは、この Scope の `artifacts/iss63-table-*.png` にあります。
