## この資料で分かること

:::summary
- favicon は対応が必要があると印付きになります。
- 通知は、開いた直後から対応が必要だった頂点では出さず、新しく入った頂点が2回続けて読めたときに1回だけ出します。
- 通知を許可したときだけ、見えない間も 30 秒ごとに読みます。
:::
