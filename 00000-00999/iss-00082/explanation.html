## この資料で分かること

:::summary
- `/`・`/index.html`・`/apexes` が指揮の画面、`/inbox` が受け箱です。
- Run の木の根は、統括の端末、生きている作業者の `parentPaneKey`、束の頂点の順に探します。
- 構造化 Chat の統括は、子のタブが閉じた後の再起動では結べません。Orca 本体への要望の下書きを report.md に置きました（送っていません）。
:::
