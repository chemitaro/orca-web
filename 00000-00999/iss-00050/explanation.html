## この資料で分かること

:::summary
- 承認がどこから来て、どんな形でカードになるか
- 答えがどの道で Orca に届き、二重に届かないのはなぜか
- 「常に許可」をもう一度確かめる理由と、その守りが画面とサーバーの2か所にあること
- 端末のエージェントの許可が、まだ読むだけである理由と、続きの案
:::

## 背景と目的

エージェントは、道具を使う前や計画を進める前に、本人の許可を求めることがあります。これまで小窓は、それを「表示できない（許可の確認）」と出すだけでした。この Issue では、何の許可かと選択肢をカードで出し、Orca のチャットのタブ（構造化 Chat）の承認には小窓から答えられるようにしました。質問のカード（iss-00048）と同じ部品と守りを使っています。

## 全体の構成

```plantuml id=overview
@startuml
title 承認のカードと答えの道
top to bottom direction
actor "利用者" as User
component "小窓 /embed/agent\n(approval-view.js / approval-dom.js)" as UI
component "orca-web サーバー\n(会話の正規化 / SendService)" as Server
component "Orca\n(agentSession.history /\nagentSession.respondToApproval /\nタブの agentStatus)" as Orca
User -> UI : 選択肢を押す（常に許可は確かめてから）
UI -> Server : POST /api/approval/intent → confirm
Server -> Orca : respondToApproval（optionId、itemId と revision の比較）
Orca --> Server : resolved / 拒み
Server --> UI : 結果（5つの分け方）
Server -> Orca : 会話とタブを読み直す
Server --> UI : 承認の部分（答え済み）
@enduml
```

- 会話の正規化は、構造化 Chat の journal の approval と、端末のエージェントが待っている許可の確認（タブの agentStatus の interactivePrompt）を、同じ形の部分 `approval` にします。端末のものは、待っている間だけ会話の最後に出ます。
- 「常に許可」「常に拒否」は、後に続く確認を省く重い選択です。カードは押すと確かめの段を出し、サーバーも `confirmPersistent: true` のない要求を受けません。画面の誤りで確かめを飛ばさないためです。
- サーバーは今の送信と同じ守り（同じオリジンの JSON、短期のトークン、sendEnabled、使い捨ての票、送る前の記録、処理中の印）を使い、Orca の revision の比較に任せて二重に答えません。記録には選択肢の中身を書かず、digest と intent だけを残します。
- 端末のエージェント、URL を開く承認、知らない種類の承認は読むだけで、理由と「Orca で開く」を示します。

## 続き

- 端末のエージェントの許可への答え（Orca と同じキーの列）：iss-00049 の仕組みの後の次の Issue（案は report.md）
