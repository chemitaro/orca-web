## この資料で分かること

:::summary
- エージェントは「頂点」「メンバー」「結べないもの」のどれか1つに分かれます。
- 頂点の状態は配下を含めて決まり、配下が動いていれば頂点は作業中です。
- 状態が分からない頂点は完了にせず、「確かめられない」の札を付けます。
:::

## 分け方

- メンバー：`parentPaneKey` が今ある別のエージェントの `paneKey` にちょうど1つ一致するもの（何段でもたどる）。
- 頂点：`parentPaneKey` も `worker` もないもの。
- 結べないもの：それ以外。親のタブが閉じた子など。

## 状態の決め方（上から順）

1. 対応が必要：頂点が許可待ち・入力待ち。またはメンバーが許可待ち・入力待ちで 20 秒たった。
2. 作業中：チームの誰かが動いている（20 秒の猶予の中も）。
3. 頂点の状態が不明：作業中に「確かめられない」の札。
4. 完了：それ以外。

完了は、最近（24 時間以内）、以前の完了、眠っている（復元待ちか 7 日以上動きがない）に分けて、古いものは畳みます。

## 確認方法

```sh
npm test
curl -s http://127.0.0.1:<試しのポート>/api/apexes | head -c 400
```
