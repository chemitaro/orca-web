## この資料で分かること

:::summary
- ログは Orca が持つ会話の記録から読み、本文を吹き出し、ツールを折り畳みで出します。
- 送信は「意図→確かめ→確定」の3段で、確定のときに宛先を確かめ直します。
- 送った記録は、この Mac の中だけに残します。
:::

## 背景と目的

SpecDock のダッシュボードから、エージェントの様子を読み、指示を送れるようにします（spec-dock の epic-00526）。送信は取り消せないので、保証レベルは strict です。

## 全体の構成

```plantuml id=overview
@startuml
title 送信の3段
actor "利用者" as U
participant "チャットの小窓" as C
participant "orca-web" as W
participant "Orca" as O
U -> C : 本文を書く
C -> W : 送る意図
W -> O : 最新の宛先を読む
W --> C : 確かめの票（60秒、1回）
U -> C : 確定
C -> W : 票で確定
W -> O : 宛先を確かめ直し、保護つきで送る
W --> C : 結果（5つの区別）
@enduml
```

- 順番：iss-00012（読む）→ iss-00013（送る）→ iss-00014（埋め込みと受け入れ）。

## 確認方法

```sh
spec-dock scope show epic-00004 --json
```
