## この資料で分かること

:::summary
- Antigravity は Orca の中で、構造化 Chat としても端末のエージェントとしても動く。
- 構造化 Chat の質問は、今の orca-web のまま Orca の回答の RPC で答えられる（実物で確かめた）。
- 端末の Antigravity には、前面のプロセスが `antigravity` のときだけ送る。端末の質問と許可の確認には答えない。
:::

## 背景と目的

Orca に Antigravity CLI（`agy`）が入った。orca-web の送信の守りは、端末の前面のプロセスが宛先のエージェントそのものかを確かめるが、その照合は Claude と Codex しか知らなかったので、端末の Antigravity には送れなかった。

## 経路ごとの扱い

| 経路 | 送信 | 質問の答え | 許可の確認 |
|---|---|---|---|
| 構造化 Chat | `agentSession.send`（今のまま） | `agentSession.respondToQuestion`（今のまま） | 今のまま（RPC） |
| 端末 | 前面が `antigravity` のときだけ（この Issue で足す） | 答えない（Orca 自身もキーの列を持たない） | 答えない |

端末の質問に答えるキーの列は、Orca 1.4.263 にも Antigravity の分がない。推測した列を送ると取り消せない誤った答えになるので、理由と「Orca で開く」を出して送らない。

## 確認方法

```sh
node --test test/orca/send.test.ts test/send/service.test.ts
```
