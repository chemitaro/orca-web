## この資料で分かること

:::summary
- 印のアイコンと名前は `web/embed/agent-marks-icons.js` の表の1か所で決まり、SpecDock もこの表を読みます。
- Antigravity と Gemini は種類（道具）ごとに別のアイコンにします。モデルごとにはしません。
- 送信と質問への回答は、実物の Antigravity で確かめてから作ります（strict）。
:::

## 背景と目的

Orca は Antigravity のエージェントを `antigravity`、Gemini CLI を `gemini` という種類で報告します。今の表には Claude と Codex しかなく、それ以外は中立の丸になります。送信の照合と質問に答えるキーも、Claude と Codex だけです。

## 全体の構成

```plantuml id=overview
@startuml
title orca-web の3つの Issue
component "iss-00066 アイコンと名前" as O1
component "iss-00067 送信の照合と回答（strict）" as O2
component "iss-00068 モデルと推論の深さ" as O3
component "SpecDock iss-00674 種類の名前" as S2
O1 --> S2 : 名前の表を読む
@enduml
```

3つの Issue は書く範囲が重ならないので、並べて進めます。iss-00066 は SpecDock の iss-00674 が待つので、先に入れます。

## 確認方法

```sh
spec-dock scope show epic-00065 --json
npm test
```
