## この資料で分かること

:::summary
- Orca が Antigravity のモデルと推論の深さを、どこに出していて、どこに出していないか。
- orca-web が、構造化 Chat のエージェント（chat-tab）の `model`・`effort` を何から作るか。
- 値がないときに出る理由（no-source、not-provided など）の意味。
:::

## 背景と目的

Orca に Antigravity CLI（`agy`）が入り、Gemini などのモデルのエージェントが worker として動くようになりました。orca-web の状態の文書には、各エージェントの `model`・`effort` の欄がありますが、Antigravity のエージェントでは、いつも「出どころなし」でした。

実物の Orca 1.4.263 で確かめると、Antigravity のエージェントは構造化 Chat（タブの種類 `agent-session`）として動き、そのタブや `orca worktree ps` にはモデルの項目がありません。一方、worker として起動したものは、Orca の起動の記録（`worker-show` の `startOptions.launch`）に、選んだモデルと推論の深さが残っています。orca-web は端末のタブでは起動の記録を読んでいましたが、構造化 Chat のタブでは読んでいませんでした。

## 全体の構成

```plantuml id=overview
@startuml
title chat-tab の model・effort の出どころ
top to bottom direction
component "Orca の worker の起動の記録\nstartOptions.launch\n(effective / requested)" as Launch
component "構造化 Chat のタブ\n(agent-session)" as Tab
component "orca-web の正規化\nnormalize.ts の chatTab" as Norm
database "状態の文書\nagents[].model / effort" as Doc
Tab --> Norm : sessionId で worker を結ぶ
Launch --> Norm : 結んだ worker の値
Norm --> Doc : 値と出どころの名前
@enduml
```

- タブの sessionId の worker がちょうど1つのときだけ結びます（今の結び方のまま）。
- 結べたら、その worker の起動の記録の `effective` を先に、なければ `requested` を使います。出どころは `workerLaunch` と、読んだ項目の名前で残ります。
- 結べないとき（利用者が開いた Chat など）は、今どおり「出どころなし」です。
- 端末のタブ（Claude・Codex の端末など）の読み取りは変えません。

## 値がないときの理由

| 理由 | 意味 |
| --- | --- |
| no-source | 出どころがない（worker に結ばれない Chat） |
| not-provided | 起動の記録はあるが、モデルや推論の値がない（Orca がモデルを受けない道具） |
| not-fetched | 終わって放された worker なので、起動の記録を読んでいない |
| source-failed | 起動の記録を読めなかった |

## 確認方法

試しの orca-web を起動し、状態の API で Antigravity の chat-tab の `model`・`effort` を見ます。

```sh
npm run trial
curl -s http://127.0.0.1:8792/api/state
```
