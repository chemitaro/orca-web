## この資料で分かること

:::summary
- 4つの Issue（土台、状態の API、開く口とボタン、常駐）で作ります。
- 状態は CLI を基本に読み、取れない値は「取れない」と示します。
- 開く口は既存のタブを選ぶだけで、新しいタブは作りません。
:::

## 背景と目的

SpecDock の epic-00471 は、図の上に Orca の状態を重ねたいと考えています。そのための読む口と、Orca の該当のタブへ飛ぶボタンを先に用意します。

## 全体の構成

```plantuml id=overview
@startuml
title epic-00003 の順番
left to right direction
rectangle "iss-00005 土台" as A
rectangle "iss-00006 状態の API" as B
rectangle "iss-00007 開く口とボタン" as C
rectangle "iss-00008 常駐と実機" as D
A --> B
A --> C
B --> D
C --> D
@enduml
```

- 開く順：指定のエージェント → 最後に動いたエージェント → 最後に見ていたタブ → worktree だけ。
- 書き込み（開く、項目の選択）は、Origin と Host と短期のトークンで守ります。

## 確認方法

```sh
spec-dock scope show epic-00003 --json
```
