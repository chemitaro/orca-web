## この資料で分かること

:::summary
- 「Orca で開く」が、どのタブを、どの Orca の操作で前面に出すか。
- 書き込みの守り（Host、Origin、トークン、frame-ancestors）が、何をどこで止めるか。
- ボタンの部品を、SpecDock の画面にどう置くか。
- 新しいタブを作らないことを、コードと実機でどう確かめるか。
:::

## 背景と目的

SpecDock のダッシュボードは、Issue ごとの worktree で動くエージェントを図に重ねます（spec-dock の epic-00471）。
その図から、該当のエージェントのタブを Orca の画面で前面に出したい、というのがこの Issue です。
Orca を操作する機能は SpecDock の中に作らず、orca-web に置き、SpecDock には iframe の小さなボタンだけを埋め込みます。
書き込みの口なので、利用者が開いた悪意あるページからの偽の要求（CSRF、DNS rebinding）を止める必要があります。

## 全体の構成

```plantuml id=overview
@startuml
title 「Orca で開く」の流れ
left to right direction
node "SpecDock の画面\n(:47800)" as SD {
  component "1行のスクリプト\nopen-button.js" as Loader
}
node "orca-web (:8791)" as OW {
  component "iframe のボタン\n/embed/open-button" as Frame
  component "守り\nHost・Origin・トークン" as Guard
  component "OpenService\n選び方と開く門" as Open
}
node "Orca（この Mac）" as Orca
Loader --> Frame : iframe を差し込む
Frame --> Guard : POST /api/token\nPOST /api/open
Guard --> Open
Open --> Orca : terminal switch\nsession.tabs.activate\nworktree.activate
@enduml
```

## どのタブを選ぶか

`POST /api/open` は `{ worktree, agent? }` を受けます。`worktree` は Orca の worktree の ID かパス、`agent` はエージェントの paneKey（`<parentTabId>:<leafId>`）です。最新の一覧から、次の順で1つを選びます。

| 順 | 選ぶタブ | 理由の値 |
|---|---|---|
| 1 | 指定の paneKey の端末のタブ | `requested-agent` |
| 2 | 最後に動いたエージェント（`agentStatus.updatedAt` が最も新しい端末のタブ） | `last-agent` |
| 3 | worktree の中で最後に見ていたタブ | `last-tab` |
| 4 | タブがない、または決められない：worktree だけ | `worktree-only` |

選んだ先で、Orca に送る操作が決まります。どれも `navigation: "host"`（この Mac の画面）に固定します。

| 選んだ先 | Orca の操作 |
|---|---|
| handle を持つ動いている端末 | CLI の `orca terminal switch --terminal <handle>` |
| ほかの既存のタブ（スリープ中の端末、ファイルなど） | RPC の `session.tabs.activate` |
| worktree だけ | RPC の `worktree.activate` |

:::note
スリープ中のエージェントのタブを開くと、Orca はエージェントを復元します。タブのない worktree を選ぶと、Orca は最初の端末を作ります。
どちらも Orca の画面でクリックしたときと同じ通常の動きとして許します（利用者と統括の判断）。
orca-web 自身は、タブやファイルを作る操作を一度も送りません。
:::

## 失敗のときの動き

- 送った後の時間切れや接続断では、別のタブへ切り替えず「開いたか確かめられない」（504 `unconfirmed`）と返します。
- 機能の確かめが通らない、一覧の形が未知、runtime の ID が変わったときは、何も送らずに理由を返します。
- 開く要求が重なったら、後の要求を 409 `busy` で断ります。

## 書き込みの守り

| 守り | 止めるもの |
|---|---|
| 127.0.0.1 と指定の Tailscale の IP だけで待ち受ける | ほかのネットワークからの接続 |
| Host の完全一致（すべての要求） | DNS rebinding |
| POST と `application/json` | フォームや画像の読み込みを使った偽の要求 |
| Origin が orca-web 自身のオリジンと完全一致 | 別のオリジンのページからの要求 |
| `X-Orca-Web-Token` の短期のトークン（10分） | トークンを持たない要求 |
| `frame-ancestors` に SpecDock のオリジンだけ | ほかのページへの埋め込み（クリックジャッキング） |

トークンは iframe の中で同じオリジンから得て、メモリーにだけ持ちます。SpecDock の画面には渡しません。
これらはブラウザー由来の偽の要求を防ぐもので、同じ Mac の悪意あるプロセスへの認証の境界ではありません。

## ボタンの置き方

```html
<script src="http://127.0.0.1:8791/embed/open-button.js" data-worktree="/path/to/worktree" data-theme="dark"></script>
```

スクリプトは自分の位置に iframe を差し込みます。親の画面の幅が 390px 以下の間は iframe を出しません（Orca で開くのは Mac の画面なので、スマホでは隠す）。

## 確認方法

```sh
npm test
npm run lint
npm run open:live -- --worktree <orca-web の worktree のパス>   # 実機。押す前と後のタブの集合を比べる
```

実機の確かめの結論は、この Scope の `report.md` にあります。
