## この資料で分かること

:::summary
- 頂点ごとのチームの節は、エージェントと Dispatch を重ねずに作ります。親は親の task の最後の Dispatch の節です。
- 帯は「チーム n（作業中・待ち・完了・失敗）」で、開くと字下げの木と履歴の帯が出ます。
- 動いている・待っている・最近の失敗の節はいつも出し、ほかは「完了 n」にまとめます。
:::

## 確認方法

npm test
