## この資料で分かること

:::summary
- 受け箱は、エージェントを「要対応」「止まっている」「動いている」「終わった」の4段に分けます。
- 木は Run ごとに描き、別のプロジェクトにいる作業者には札を付けます。
- 統括の連絡は既読にせずに読みます。
:::

## 背景と目的

2026-11-13 に利用者が、いちばんの入口を要対応の受け箱にすると決めました。オーケストレーションはプロジェクトに収まらないことが多いので、木の単位は Run にします。

## 全体の構成

```plantuml id=overview
@startuml
title 画面のつながり
left to right direction
rectangle "受け箱 /" as A
rectangle "プロジェクト /projects/{repo}" as B
rectangle "木 /runs/{id}" as C
rectangle "詳細とチャット /embed/agent" as D
A --> B
A --> D
B --> C
C --> D
@enduml
```

## 確認方法

```sh
spec-dock scope show epic-00016 --json
```
