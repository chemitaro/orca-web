## この資料で分かること

:::summary
- メンバーの許可待ちは［見て答える］で、同じ枠に `compose=off` のメンバーの画面を開き、既存のカードで答えます。
- 質問・判断は［頂点に伝える］で、頂点の入力欄に決めた型の下書きを入れます。自動では送りません。
- 送る経路は足していません。
:::

## 確認方法

npm test
