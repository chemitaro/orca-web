## この資料で分かること

:::summary
- 人が管理するのは、親のいない「頂点」のエージェントだけで、作業者や途中のタスク担当は頂点の中に含めます。
- 頂点の状態は「対応が必要」「作業中」「完了」の3つで、配下が動いていれば頂点は作業中です。
- 台帳は作らず、必要な情報はその都度 Orca から読みます。
:::

## 背景と目的

Orca の画面は worktree とタブの並びで、どの統括が何を指揮しているか、いま人の番なのかが分かりません。今の orca-web の受け箱も、統括が終わったことと作業者が終わったことを区別せず「終わった」に畳みます。統括が仕事を終えたら人がフォローする必要があるので、頂点を単位にした画面に作り変えます。

## 言葉

| 言葉 | 意味 |
|---|---|
| 頂点（エージェント） | 親のいないエージェント。一覧の行で、チャットの相手 |
| メンバー | 頂点の配下の作業者・途中のタスク担当。頂点の中にだけ出る |
| チーム | 頂点とメンバーの全体 |
| 対応 | 人の手が要る理由（許可待ち、質問、判断、止まった仕事、失敗） |

## 画面の形

```text
┌ 指揮 ─ 対応が必要 2・作業中 1 ─────────────┐
│ 頂点            │ 〈頂点の名前〉 作業中  [Orcaで開く] │
│ ■ 対応が必要 2  │ ┌対応（メンバーの分）──────┐ │
│ ▶ A 許可待ち1   │ │ 実装担当 X が許可待ち [答える]│ │
│ ■ 作業中 1      │ └─────────────────┘ │
│   C 配下 2/5    │ ▸チーム 3（作業中2・完了1）     │
│ ■ 完了 3・新着1 │ ┌会話（頂点だけに送れる）───┐ │
│ ▸以前の完了 46  │ │ …                [送る] │ │
│ ▸眠っている     │ └─────────────────┘ │
└─────────────────┴──────────────────────┘
```

## 進め方

1. iss-00076 頂点の一覧（今ある項目だけ）
2. iss-00077 会話を同じ画面で開く
3. iss-00078 結びと対応の判定の完成
4. iss-00079 チームの帯と履歴の帯
5. iss-00080 対応のカード
6. iss-00081 気づかせ方
7. iss-00082 `/` の差し替え

## 確認方法

```sh
spec-dock scope show epic-00075 --json
curl -s http://127.0.0.1:8791/api/apexes   # iss-00076 の後。同じオリジンからだけ読める
```
