## この資料で分かること

:::summary
- プロセスがなく状態も分からない頂点は「眠っている」です。
- プロセスがあるのに状態の分からない頂点は「不明」の段に入り、時間がたっても動かしません。
- 作業中の段には、実際に動いていると分かる頂点だけが並びます。
:::
