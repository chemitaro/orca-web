## この資料で分かること

:::summary
- 会話は既存の `/embed/agent` を iframe で右に出し、送信の部品は二重に持ちません。
- 頂点を替えるときは iframe を作り直し、iframe の中からはページを移しません。
- 見えない間は会話の接続を止め、同じホストへの接続の上限に当たらないようにします。
:::

## 仕組み

- `/embed/agent` の CSP の frame-ancestors に `'self'` を足し、自分の画面に埋め込めるようにします。
- 選んだ頂点は `?apex=` で覚えます。
- 完了の新着は、頂点を 10 秒以上見た時刻をブラウザに覚えて決めます。

## 確認方法

npm test
