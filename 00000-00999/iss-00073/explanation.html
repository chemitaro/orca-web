## この資料で分かること

:::summary
- 送れなくなった原因は2つある。機能の判定のキャッシュが古いまま残ることと、端末のタブに `ptyId` がないこと。
- 機能の判定は、runtime ID が揃った判定だけを持つように直す。これで Orca の再起動のあとに orca-web を再起動しなくても戻る。
- 端末の宛先は `ptyId` を任意にし、handle と `incarnationId` で同じ端末かを確かめる。
:::

## 背景と目的

orca-web は、`/embed/agent` の送る欄から、Orca のエージェントに指示を送ります。送る前に「Orca がその機能を持っているか」（機能の判定）と「宛先が意図のときと同じ端末か」（宛先の同一性）を確かめ、確かめられなければ送りません。

Orca を v1.4.272 に上げた後、構造化 Chat にも端末にも送れなくなりました。調べると、Orca の送信の口（RPC の名前や引数）はそのまま使えました。壊れていたのは orca-web の側の2つの確かめです。

## 原因1：古い機能の判定が残る

Orca が再起動すると、runtime ID が変わります。orca-web は、`orca status` が返す runtime ID と、`orca-runtime.json` の runtime ID が揃っているかを確かめ、揃っていなければ送りません。

再起動の途中では、2つの ID が一瞬だけ食い違います。そのときの判定（揃っていない）を orca-web がキャッシュすると、後で `orca-runtime.json` が新しい ID になったとき、キャッシュの ID と一致してしまいます。そのため、orca-web を再起動するまで「揃っていない」のまま送りません。

直し方：揃った判定だけをキャッシュします。揃っていない判定は返すだけにして、次に呼ばれたときに確かめ直します。

```plantuml id=cache
@startuml
title 機能の判定のキャッシュ
participant "orca-web" as W
participant "Orca" as O
W -> O : 確かめる（再起動の途中）
O --> W : status は新しい ID、file は古い ID
note right of W : 揃っていない。\n直した後は持たない
W -> O : 次の要求で確かめ直す
O --> W : status も file も新しい ID
note right of W : 揃った判定を持ち、送れる
@enduml
```

## 原因2：端末のタブに ptyId がない

`orca agent launch` で起動した端末のエージェントのタブは、タブの一覧（`session.tabs.listAll`）に `ptyId` を持ちません。orca-web はこれを宛先の必須の識別子にしていたので、送りませんでした。

Orca 自身は、端末の同一性を「handle の今の持ち主」の `incarnationId` に結びます。orca-web も送る直前の前面の確かめで `expectedIncarnationId` を付けて読むので、別の端末に変わればそこで分かります。

直し方：`ptyId` を任意にします。同じ端末かどうかは、handle と `incarnationId` が同じかで確かめます。`ptyId` は、意図のときと送る直前の両方にあるときだけ比べます。

## 変えないこと

- 送信の門（Orca に送ってよい RPC と形）は広げません。新しい RPC も通しません。
- 送り直しはしません。結果が分からないときは、今のとおり「要確認」にします。
- 送信の記録の形（`orca-web.send-record/v1`）は変えません。

## 確認方法

テストは、Orca 1.4.272 から録って仮名にした応答で確かめます。実物は、この worktree に起動した使い捨ての検証用のエージェントだけに送って確かめます。

```sh
npm test
npm run send:live -- --worktree <検証用の worktree> --handle <端末の handle>
```
