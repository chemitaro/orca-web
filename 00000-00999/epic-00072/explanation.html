## この資料で分かること

:::summary
- この Epic は、Orca の版上げで壊れた orca-web の機能を、送信の安全の約束を保ったまま直す単位です。
- 子の iss-00073 で、Orca 1.4.272 で止まった送信を直しました。詳しい原因と直し方は、その説明資料にあります。
:::

## 背景と目的

orca-web は Orca の CLI と内部の RPC を読み、エージェントに指示を送ります。Orca は頻繁に版が上がり、応答の形や起動のしかたが変わることがあります。この Epic は、そのような変化への追随を1か所にまとめます。

## 子の Scope

| Scope | 内容 | 結果 |
|---|---|---|
| iss-00073 | 機能の判定のキャッシュと、ptyId のない端末のタブへの送信 | 完了（PR #74） |

## 確認方法

```sh
spec-dock scope show iss-00073 --json
```
