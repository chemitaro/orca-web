## この資料で分かること

:::summary
- 「束」は、Run と世代ごとの task の集まりです。束の持ち主の頂点を決めて、閉じた子も配下に数えます。
- 対応が必要の理由に、未回答の質問、未解決の判断、止まった仕事、統括のタブの閉じ、新しい失敗を足します。
- Orca を読めないときは、新しく鳴らしません。
:::

## 結び方

1. 今つながっている子（`parentPaneKey`）。
2. 端末の統括：束の根の task の作成者の paneKey が頂点と同じ。
3. 構造化 Chat の統括：つながっている子から束をたどり、メモリに覚える。再起動で消える。

## 確認方法

```sh
npm test
