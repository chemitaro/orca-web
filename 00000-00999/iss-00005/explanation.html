## この資料で分かること

:::summary
- orca-web が Orca とどうつながるか（CLI と、内部の Unix ソケットの RPC）。
- 「機能の確かめ」が何を見て、機能ごとに何を返すか。
- 録画と再生のテストが、秘密と本文をどう残さないか。
- 実機の確かめで何を調べ、どこに結論を書くか。
:::

## 背景と目的

orca-web は、Orca（この Mac のデスクトップアプリ）の状態を読み、既存のタブを前面に出し、後には会話を読んで指示を送る小さな Web サービスです。
Orca の CLI の JSON と、内部の RPC は、どちらも版で変わりえます。そこで、Orca に触る所を `src/orca/` に閉じ込め、
初めと再接続のときに機能ごとに確かめて、読む機能は欠けを示して続け、確かめられない書き込みは使わないようにします。
この Issue は、後の Issue（状態の API、開く口、会話のログと送信）が乗る土台です。

## 全体の構成

```plantuml id=overview
@startuml
title orca-web のアダプター
top to bottom direction
component "src/server（後の Issue の API）" as Server
package "src/orca（アダプター）" {
  component "OrcaCli" as Cli
  component "CliRunner\n（絶対パス・引数の配列・管理した環境変数）" as Runner
  component "ReadOnlyRpc" as RO
  component "UnixSocketRpc\n（NDJSON の単発の要求）" as Rpc
  component "RuntimeLocator\n（orca-runtime.json。authToken は中に閉じる）" as Loc
  component "probeCapabilities" as Probe
}
node "Orca（この Mac）" as Orca
Server --> Probe
Probe --> Cli
Probe --> RO
Cli --> Runner
RO --> Rpc
Rpc --> Loc
Runner --> Orca : orca ... --json
Rpc --> Orca : Unix ソケット
@enduml
```

- **CLI の境界**：`execFile` で、シェルを通さずに絶対パスの `orca` を呼びます。環境変数は許した名前だけを渡し、`ORCA_ENVIRONMENT` や `ORCA_PAIRING_CODE` で別の Orca につながらないようにします。
- **RPC の境界**：`orca-runtime.json` から Unix ソケットの口と authToken を読み、1回の接続で1つの要求を送り、応答を1つ受けます。authToken は、戻り値、誤りの文、ログ、録画に出ません。この Issue では読む RPC（`session.tabs.list`、`session.tabs.listAll`、`nativeChat.readSession`）だけを送れます。
- どちらの境界も interface で、テストでは録画の再生に差し替えます。

## 機能の確かめ

| 機能 | 使えるための確かめ |
|---|---|
| `readState` | runtime に届き、`repo list`、`worktree list`、`worktree ps`、`terminal list`、オーケストレーションの一覧のコマンドがある |
| `readTabs` | `session.tabs.listAll` が読め、タブの識別子（`id`、`parentTabId`、`leafId`）がある |
| `openExistingTab` | `readTabs` と `terminal switch` と capability `session-tabs.authoritative-inventory.v1` がある。activate の口は呼ぶときに確かめる（確かめのために書き込みを呼ばない） |
| `readTranscript` | `nativeChat.readSession` の口がある |
| `sendGuarded` | `terminal.prompt-delivery.v1` と `terminal send` があっても、保護された送信の経路を orca-web が確かめるまで（epic-00004）使えない |

runtime の ID（`status`、`orca-runtime.json`、RPC の応答）が食い違えば、書き込みの機能を使えないとします。ID が変われば確かめ直します。

## 録画と再生

CLI は argv、終了コード、stdout、stderr、遅延を、RPC は届いた順の生の文字列（分割、keepalive、不正な JSON）と閉じ方を録画します。
録画は書き出す前に仮名化し、検査します。

- 秘密の項目（authToken など）は消し、ペアリングの URL は伏せます。
- プロンプト、題名、会話の本文などの自由な文は `text-N` に置き換えます（同じ文は同じ仮名）。
- パスは区切りごとに `p-N` に、UUID などの ID は `uuid-N` などに置き換えます。文字列の中の一部も置き換えるので、`repoId::path` や `tabId:leafId` の対応も保たれます。
- authToken の値、利用者の家のパス、`orca://pair` が残る録画は、書き出さずに止まります。

## 確認方法

```sh
npm ci
npm run lint
npm test
npm run probe:live   # この Mac の Orca で読むだけの確かめ。集計だけを出す
```

実機の確かめの結論は、この Scope の `report.md` にあります。
