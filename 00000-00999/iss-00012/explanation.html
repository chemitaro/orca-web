## この資料で分かること

:::summary
- 会話のログをどこから読み、どう取り違えずに配るか。
- Orca の購読の口が使えないので、末尾を読み直して差を作ること。
- 詳細とチャットの画面が、信頼しない本文をどう描くか。
:::

## 背景と目的

orca-web は SpecDock に3つの部品（稼働の印、Orca で開く、詳細とチャット）を渡します。この Issue は「詳細とチャット」の読むだけの形を作ります。
同じ画面を、orca-web の単独の画面からも開きます。送信の欄は、iss-00013 で確認つきの送信を作るまで出しません。

## 全体の構成

```plantuml id=overview
@startuml
title 会話のログの流れ
top to bottom direction
actor "利用者" as User
component "画面 /embed/agent" as Page
component "orca-web\n/api/transcript\n/api/transcript/events (SSE)" as Web
component "見張り（エージェントごとに1つ）" as Hub
component "Orca のランタイム\n(Unix ソケット)" as Orca
User -> Page : 開く
Page -> Web : SSE を購読、前のページを読む
Web -> Hub : 購読者を足す
Hub -> Orca : 1.5秒ごとに末尾を読む\n(nativeChat.readSession /\nagentSession.history)
Hub --> Page : snapshot / appended / replacement / unavailable
@enduml
```

- **取得元**：端末の Claude Code と Codex は `nativeChat.readSession`、構造化 Chat は `agentSession.history`。セッションの識別子と記録のパスは、Orca がタブに持つ値を使います（Orca の画面と同じ）。
- **購読の口**：Orca 1.4.256 の Unix ソケットは streaming の method を拒みます。そこで、サーバーが末尾を短い間隔で読み直し、前の窓と比べて差を作ります。
- **別の会話を混ぜない**：窓は「セッションの鍵」（エージェント、取得元、種類、セッションの識別子）ごとに持ち、鍵が変われば置き換えを送ります。前のページの位置にも鍵を含め、違えば 409 で断ります。
- **思考は出さない**：印も付けません。「表示できない」の印は、画像や未知のブロックなど、未対応の部分だけです。

## 失敗したときの動き

読めないとき（タブがない、セッションがない、記録がない、Orca に届かない、知らない形）は、空の会話ではなく、理由の code を返し、画面は「読めない」と示します。
本文、ツールの出力、題名は textContent でだけ描き、画面は inline の script を許さない CSP で配ります。

## 確認方法

```sh
npm test
npm run transcript:live   # 件数と結論だけを出す
npm start                 # http://127.0.0.1:8791/ の状態の画面から、エージェントの行を開く
```
