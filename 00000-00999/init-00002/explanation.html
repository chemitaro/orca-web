## この資料で分かること

:::summary
- orca-web は、Orca の状態を読む・開く・送るを1つの常駐サービスにまとめ、SpecDock のダッシュボードに部品として渡します。
- 読む・開く・送るは、安全の扱いが違うので、別の部品にします。
- 作る順番は、状態と「Orca で開く」（epic-00003）が先で、チャット（epic-00004）が後です。
:::

## 背景と目的

SpecDock のダッシュボードは仕様の構造を見せますが、Orca で動くエージェントの様子は見えません。公式の Orca Web は、特定のセッションを URL で開けず、埋め込むには大きすぎるため使いません。そこで、必要な部分だけを持つ小さなサービスを作ります。

## 全体の構成

```plantuml id=overview
@startuml
title orca-web の構成
top to bottom direction
actor "利用者（Mac・スマホ）" as User
component "SpecDock のダッシュボード" as SD
component "orca-web（常駐）" as OW
component "Orca デスクトップアプリ" as Orca
User -> SD : 見る
SD -> OW : 状態を読む（JSON）
SD ..> OW : 開くボタン・チャットを埋め込む（iframe）
OW -> Orca : CLI と内部の口
@enduml
```

- 状態：orca-web が集めて小さな JSON にし、SpecDock が図に描きます。
- 「Orca で開く」：Mac の Orca で既存のタブを前面に出します。ボタンだけを別の画面に置けます。スマホでは出しません。
- チャット：会話の記録を吹き出しで読み、確かめてから送ります。送った記録は Mac の中だけに残します。

## 確認方法

```sh
spec-dock scope show init-00002 --json
```
