## この資料で分かること

:::summary
- `GET /api/state` が何を返し、各値の「意味」「取得元」「鮮度」「欠けた理由」をどう示すか。
- モデルと推論レベルが、どこから、どの意味で取れ、取れないときにどう返るか。
- Orca をどの間隔で読み、要求が増えても Orca を呼ぶ回数が増えない仕組み。
- 項目の選択の保存と、SpecDock のオリジンだけに読み取りを許す CORS。
- Orca が止まったときの動き。
:::

## 背景と目的

SpecDock のダッシュボードは、Scope の図の上に Orca のエージェントの稼働を重ねたい（spec-dock の epic-00471）。
Orca を触るのは orca-web だけにするので、orca-web が Orca を読み、小さな読み取りの JSON を返します。

Orca から取れる値には、意味の違うものが混ざります。たとえばモデルは、担当の起動の要求、起動時の解決、エージェントが報告した値で意味が違い、
ふつうのエージェントでは取れません（iss-00005 の実機の確かめ）。そこで、値ごとに意味と取得元を付け、取れない値は別の値で埋めずに `null` と理由で返します。

## 全体の構成

```plantuml id=overview
@startuml
title 状態の API の流れ
left to right direction
component "Orca\n（CLI と内部の RPC）" as Orca
package "orca-web" {
  component "read-state\n（読んで項目を減らす）" as Read
  component "StatePoller\n（共有のポーリングと最後の値）" as Poller
  component "normalizeState\n（正規化）" as Norm
  component "HTTP\n/api/state /api/fields" as Http
  component "状態の画面\n（web/）" as Web
}
actor "SpecDock の\nダッシュボード" as SD
Read --> Orca : 読む要求だけ
Poller --> Read : 期限の来た組
Http --> Poller : snapshot()
Poller --> Norm
SD --> Http : GET（CORS は正確なオリジンだけ）
Web --> Http : GET と PUT（同じオリジン）
@enduml
```

## 値の形

各項目は `{ value, source, field, missing }` の形です。`source` は取得元の名前（`tabs`、`worktreePs`、`workerLaunch` など）で、
文書の `sources` を引くと、その取得元をいつ読んだか、最後に成功したのはいつか、古いか、誤りがあるかが分かります。

| 欠けた理由 | 意味 |
|---|---|
| `not-provided` | 取得元は読めたが、この対象には値がない（例：Claude Code のモデル） |
| `no-source` | この種類の対象には取得元がない（例：Codex の推論） |
| `not-linked` | 結ぶ鍵がない（例：端末の handle のないタブの最後の出力） |
| `not-fetched` | 方針で読まない（例：終わった担当の起動の値） |
| `source-failed` | 取得元が一度も成功していない |
| `source-unavailable` | Orca の機能が使えない |
| `invalid-value` | 知らない形の値 |

モデルと推論は、読めた値をすべて `readings` に並べ、先頭を代表にします。

| 意味 | 取得元 |
|---|---|
| `current-selection`（現在の選択） | タブの `agentStatus.providerSession.effort`（Claude Code の推論だけ） |
| `last-observed`（最後の観測） | タブの `agentStatus.model`（今の Orca では出ない） |
| `launch-resolved`（起動時の解決） | 担当の `worker-show` の `startOptions.launch.effective` |
| `launch-requested`（起動の要求） | 担当の `worker-show` の `startOptions.launch.requested` |

## Orca の読み方

サーバーの中の1つのポーリングだけが Orca を読み、要求はその結果から正規化して返します。

| 組 | 取得元 | 見ているとき | 見る人がいないとき |
|---|---|---|---|
| fast | タブ、worktree ps、端末 | 5秒 | 30秒 |
| orchestration | Run、Task、担当、担当の起動の値 | 10秒 | 30秒 |
| slow | repo、worktree list | 60秒 | 120秒 |

最後の `/api/state` から 60秒を過ぎると「見る人がいない」とし、間隔を遅くします。プロンプト、ツールの入力、最後の応答、Task の spec と result は、読んだその場で捨て、返しません。

## 失敗したときの動き

- Orca が動いていない：`connection.state` が `unreachable` になり、取得元ごとに最後に読めた値と時刻を返します（`stale` が真）。画面は止まらず、読み直しを続けます。
- 一部の取得元だけが失敗：その取得元だけが前の値と誤りで返り、ほかは新しい値になります。
- 設定のファイルが壊れている：既定の選択で動き、理由を `/api/fields` で返します。

## 確認方法

```sh
npm test
npm start   # http://127.0.0.1:8791/
curl -s http://127.0.0.1:8791/api/state | head -c 400
curl -si -H 'Origin: http://127.0.0.1:47800' http://127.0.0.1:8791/api/state | grep -i access-control
```
