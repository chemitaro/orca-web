## この資料で分かること

:::summary
- 種類のアイコンと名前は `web/embed/agent-marks-icons.js` の表 `AGENT_ICONS` の1か所で決まり、`iconKey` が種類の値を表の鍵にします。
- この変更で `antigravity` と `gemini` が表の鍵になり、知らない種類は今どおり中立の丸です。
- アイコンは stablyai/orca（MIT）から写し、色はロゴの主な単色にしています。
:::

## 背景と目的

Orca に Antigravity CLI が入り、Orca は Antigravity のエージェントを `agentType: "antigravity"`、Gemini CLI を `"gemini"` で報告します。これまでの orca-web はこの2つを「ほかの種類」の丸で出していたので、印を見ても何のエージェントか分かりませんでした。SpecDock のダッシュボードも同じ表の名前を読みます。

## 全体の構成

```plantuml id=overview
@startuml
title 種類の表を使う場所
top to bottom direction
component "agent-marks-icons.js\nAGENT_ICONS・iconKey" as Table
component "稼働の印\n(agent-marks-view.js)" as Marks
component "送信の欄の名前\n(send-view.js)" as Send
component "SpecDock の画面" as Dock
Marks --> Table : アイコンと読み上げの名前
Send --> Table : placeholder の名前
Dock --> Table : label を読む
@enduml
```

## 確認方法

```sh
npm test
npm run trial   # 試しの画面の「状態の見本」に Antigravity と Gemini の印が出る
```
