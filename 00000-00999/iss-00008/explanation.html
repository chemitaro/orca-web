## この資料で分かること

:::summary
- orca-web の LaunchAgent が、何を、どこから、どの設定で起動するか。
- 待ち受けのアドレスが 2つから増えないことを、どう守り、どう確かめるか。
- Tailscale がまだ動いていないとき、orca-web がどう振る舞うか。
- 入れる・外す・起動し直す命令と、本物の登録を誰がいつ行うか。
:::

## 背景と目的

orca-web は、SpecDock のダッシュボードに Orca の状態と「Orca で開く」のボタンを出すための小さなサービスです（iss-00006、iss-00007 で作りました）。
ダッシュボードから使うには、いつも動いている必要があります。そこで、SpecDock のダッシュボード（`io.github.chemitaro.spec-dock.dashboard`）と同じく、launchd の LaunchAgent として常駐させます。

書き込み（開く口）を持つサービスなので、待ち受けるアドレスは安全の境界です。0.0.0.0 で待ち受けると、同じネットワークのほかの機械から届いてしまいます。待ち受けは、手元（127.0.0.1）と、利用者の端末だけが届く Tailscale の IP の2つに限ります。

## 全体の構成

```plantuml id=overview
@startuml
title 常駐の構成
left to right direction
actor "利用者" as User
node "launchd（gui/<uid>）" as LD
node "orca-web（node dist/server/main.js）" as OW {
  component "startListeners\n127.0.0.1 と Tailscale の IP" as L
  component "HTTP の処理\n/api/state、/api/open、/embed/*" as H
}
file "io.github.chemitaro.orca-web.plist\n（環境変数で設定）" as P
file "~/Library/Logs/orca-web/service.log" as Log
User --> P : npm run service:install
LD --> P : 読む（ログインのとき）
LD --> OW : 起動・止まったら起動し直す
L --> H
OW --> Log : 待ち受けの変化を書く
@enduml
```

## 待ち受けと、Tailscale がないとき

- 待ち受けのアドレスは、設定の `bindAddresses`（127.0.0.1 と、検査を通った `ORCA_WEB_TAILSCALE_IP`）だけから来ます。listen は、いつもアドレスを付けて呼びます（付けないと 0.0.0.0 になるため）。
- 127.0.0.1 で待ち受けられないとき（ポートの使用中など）は、終了コード1で止まり、launchd が10秒の後に起動し直します。
- Tailscale の IP で待ち受けられないとき（ログインの直後で Tailscale がまだ動いていないなど）は、127.0.0.1 だけで動き続け、ログに1行を書き、30秒ごとに試し直します。`GET /api/health` の `listeners` で、アドレスごとの状態（`listening`、`retrying`）が分かります。
- 入れるときに Tailscale の IP が取れなければ、Tailscale なしの定義を書き、そのことを出力に出します。

## 命令

```sh
npm run service:install            # ビルドして、定義を書き、読み込む（--dry-run で書かずに見る）
npm run service:status             # 読み込みの状態と待ち受けの状態
npm run service:restart            # ビルドして、起動し直す
npm run service:uninstall          # 外して定義を消す（ログと設定は残す）
```

本物の登録（`~/Library/LaunchAgents` への書き込みと `launchctl bootstrap`）は利用者の環境を変えるので、この Issue の作業では行いません。マージの後に統括が行い、ログインし直しても動くことを確かめます。

## 実機での受け入れ

一時の起動（`node dist/server/main.js`）で、状態の画面、項目の選択、別のオリジンの画面に置いた開くボタン、幅 390px、Orca に届かないときの表示、Tailscale の IP での読み取りを、ブラウザーで確かめます。結果は report.md に、件数と結論だけを書きます。スマホでの確かめは利用者に頼みます。
