## この資料で分かること

:::summary
- 質問がどこから来て、どんな形でカードになるか
- 答えがどの道で Orca に届き、二重に届かないのはなぜか
- 端末のエージェントの質問と承認が、まだ答えられない理由と、続きの Issue
:::

## 背景と目的

エージェントは、本人に選択肢で問うことがあります（Claude Code の AskUserQuestion など）。これまで小窓はそれを「表示できない（質問）」と出すだけで、本人は Orca を開いて答える必要がありました。この Issue で、問い・選択肢・その他の自由入力をカードで出し、Orca のチャットのタブ（構造化 Chat）の質問には小窓から答えられるようにしました。

## 全体の構成

```plantuml id=overview
@startuml
title 質問のカードと答えの道
top to bottom direction
actor "利用者" as User
component "小窓 /embed/agent\n(question-view.js / question-dom.js)" as UI
component "orca-web サーバー\n(会話の正規化 / SendService)" as Server
component "Orca\n(agentSession.history /\nagentSession.respondToQuestion)" as Orca
User -> UI : 選んで「答える」
UI -> Server : POST /api/answer/intent → confirm
Server -> Orca : respondToQuestion（itemId と revision の比較）
Orca --> Server : resolved / 拒み
Server --> UI : 結果（5つの分け方）
Server -> Orca : 会話を読み直す
Server --> UI : 質問の部分（答え済み）
@enduml
```

- 会話の正規化は、構造化 Chat の journal の question と、端末のエージェントの AskUserQuestion・request_user_input の呼び出しを、同じ形の部分 `question` にします。
- カードの部品は、答える手段（answerer）を差し替えられます。構造化 Chat の手段は答えの口を使い、端末の手段は答えずに「Orca で開く」を示します。
- サーバーは今の送信と同じ守り（同じオリジンの JSON、短期のトークン、sendEnabled、使い捨ての票、送る前の記録、処理中の印）を使い、Orca の revision の比較に任せて二重に答えません。記録には答えの中身を書かず、digest だけを残します。

## 続き

- 端末のエージェントの質問への答え（Orca と同じキーの列）：iss-00049
- 承認（approval）の表示と答え：iss-00050
