<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>指揮 — orca-web</title>
    <link rel="icon" id="favicon" href="/favicon.svg" />
    <link rel="stylesheet" href="/embed/open-control.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="inbox apexes-page">
    <header>
      <div class="bar">
        <h1>指揮</h1>
        <div id="counts"></div>
        <span id="notify" class="apex-notify-slot"></span>
        <nav class="links">
          <a href="/">受け箱</a>
          <a href="/runs">Run の一覧</a>
          <a href="/settings">状態</a>
        </nav>
      </div>
      <div id="freshness" role="status" aria-live="polite"><p>読み込み中…</p></div>
    </header>
    <div class="apex-layout">
      <main id="sections" class="apex-list"></main>
      <section id="pane" class="apex-pane" aria-label="選んだ頂点">
        <div id="pane-head" class="apex-pane-head"></div>
        <div id="pane-frame" class="apex-pane-frame"></div>
      </section>
    </div>
    <script type="module" src="/apexes.js"></script>
  </body>
</html>
