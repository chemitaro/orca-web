<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>orca-web の試し</title>
    <link rel="stylesheet" href="./trial.css" />
  </head>
  <body>
    <header class="top">
      <span class="sample">試しの画面（SpecDock とは別のオリジン）</span>
      <h1>稼働の印</h1>
      <p class="lead">worktree ごとのエージェントの印（種類はアイコン、状態は色、経過は短い文字）。印を選ぶと詳細とチャットが開きます。</p>
      <p id="banner" class="banner" role="status" aria-live="polite" hidden></p>
      <p id="status" class="note"></p>
    </header>
    <main class="layout">
      <div class="samples">
        <section class="sample-block" aria-labelledby="states-title">
          <h2 id="states-title">状態の見本（手で作った値）</h2>
          <p class="note">実機の値ではありません。部品が working・monitoring・done をどう描くかの見本です。</p>
          <ul id="states" class="rows states"></ul>
        </section>
        <section class="sample-block" aria-labelledby="boxes-title">
          <h2 id="boxes-title">構造の図の箱の見本</h2>
          <div id="boxes" class="boxes"></div>
          <div id="boxes-slot" class="slot sample-slot"></div>
        </section>
        <section class="sample-block" aria-labelledby="rows-title">
          <h2 id="rows-title">Issue の一覧の行の見本</h2>
          <ul id="rows" class="rows"></ul>
          <div id="rows-slot" class="slot sample-slot"></div>
        </section>
        <section class="sample-block" aria-labelledby="sections-title">
          <h2 id="sections-title">worktree の節</h2>
          <div id="sections" class="sections"></div>
        </section>
      </div>
      <aside id="panel" class="panel" aria-label="詳細とチャット" hidden>
        <h2 id="panel-title">詳細とチャット</h2>
        <div id="panel-slot" class="slot"></div>
      </aside>
    </main>
    <script type="module" src="./trial.js"></script>
  </body>
</html>
