<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>エージェント</title>
    <link rel="stylesheet" href="./agent.css" />
  </head>
  <body>
    <header id="head">
      <h1 id="title">読み込み中…</h1>
      <p class="actions">
        <button id="open" type="button" disabled>Orca で開く</button>
        <span id="open-status" role="status" aria-live="polite"></span>
      </p>
      <details id="detail-box" open>
        <summary>詳細</summary>
        <div id="detail"></div>
      </details>
    </header>
    <main id="chat">
      <p class="chat-head">
        <span id="chat-head">会話（読むだけ）</span>
        <span id="session"></span>
      </p>
      <button id="older" type="button" hidden>前を読む</button>
      <p id="chat-status" role="status" aria-live="polite">読み込み中…</p>
      <ol id="log"></ol>
    </main>
    <section id="send" aria-label="送る">
      <textarea id="send-text" rows="3" aria-label="エージェントへの指示" placeholder="エージェントへの指示" disabled></textarea>
      <div id="send-panel" aria-live="polite"></div>
    </section>
    <script type="module" src="./agent-frame.js"></script>
  </body>
</html>
