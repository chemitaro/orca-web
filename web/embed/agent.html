<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>エージェント</title>
    <link rel="stylesheet" href="./agent-marks.css" />
    <link rel="stylesheet" href="./agent.css" />
  </head>
  <body>
    <header id="head">
      <div class="title-row">
        <h1 id="title">読み込み中…</h1>
        <p class="actions">
          <button id="open" type="button" disabled>Orca で開く</button>
          <span id="open-status" role="status" aria-live="polite"></span>
        </p>
      </div>
      <details id="detail-box">
        <summary class="detail-summary"><span id="detail-mark"></span><span class="summary-label">詳細</span></summary>
        <div id="detail"></div>
      </details>
    </header>
    <main id="chat">
      <p class="chat-head">
        <span id="chat-head">会話（読むだけ）</span>
        <span id="session"></span>
      </p>
      <button id="older" type="button" hidden>前を読む</button>
      <p id="chat-status" role="status" aria-live="polite">読み込み中…</p>
      <ol id="log"></ol>
    </main>
    <section id="send" aria-label="送る欄">
      <div id="send-panel" aria-live="polite"></div>
      <div class="composer">
        <textarea id="send-text" rows="1" aria-label="エージェントへの指示" placeholder="エージェントに送る" disabled></textarea>
        <button id="send-button" type="button" aria-label="送る" title="送る" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 13V3.5M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </section>
    <script type="module" src="./agent-frame.js"></script>
  </body>
</html>
